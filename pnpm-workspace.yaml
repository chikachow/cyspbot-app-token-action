packages:
  - "."

autoInstallPeers: false
strictPeerDependencies: false
engineStrict: true
minimumReleaseAge: 4320

# Explicit version selection and CI enforce the manifest pin; keep GitHub-compatible lockfiles.
pmOnFail: ignore
autoDedupe: true
lockfile:
  includeResolutionSettings: true
verifyDepsBeforeRun: error

allowBuilds: {}
strictDepBuilds: true
